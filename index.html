<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام إدارة العيادة</title>
<style>
  :root{--main:#0f766e;--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--danger:#dc2626;--line:#e2e8f0}
  *{box-sizing:border-box}
  body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
  header{background:var(--main);color:#fff;padding:14px 16px;font-size:18px;font-weight:bold}
  nav{display:flex;gap:6px;padding:10px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0}
  nav button{flex:1;min-width:90px;padding:10px;border:0;border-radius:8px;background:var(--bg);font-size:14px;cursor:pointer}
  nav button.active{background:var(--main);color:#fff}
  main{padding:12px;max-width:900px;margin:auto}
  .card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
  h2{margin:0 0 10px;font-size:17px}
  label{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px}
  input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-family:inherit}
  textarea{min-height:70px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button.btn{background:var(--main);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:15px;cursor:pointer;margin-top:10px}
  button.btn.sec{background:#475569}
  button.btn.del{background:var(--danger)}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{background:var(--card);border-radius:12px;padding:14px;text-align:center}
  .stat b{display:block;font-size:26px;color:var(--main)}
  .item{border-bottom:1px solid var(--line);padding:10px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}
  .item:last-child{border:0}
  .item small{color:var(--muted);display:block}
  .tag{font-size:12px;padding:2px 8px;border-radius:99px;background:#ccfbf1;color:#115e59}
  .tag.done{background:#e2e8f0;color:#475569}
  .tag.unpaid{background:#fee2e2;color:#991b1b}
  .hidden{display:none}
  @media(max-width:480px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>🏥 نظام إدارة العيادة</header>
<nav id="nav">
  <button data-tab="home" class="active">الرئيسية</button>
  <button data-tab="patients">المرضى</button>
  <button data-tab="appts">المواعيد</button>
  <button data-tab="visits">الزيارات والفواتير</button>
  <button data-tab="backup">نسخ احتياطي</button>
</nav>
<main>

<section id="home">
  <div class="stats">
    <div class="stat"><b id="sPatients">0</b>عدد المرضى</div>
    <div class="stat"><b id="sToday">0</b>مواعيد اليوم</div>
    <div class="stat"><b id="sIncome">0</b>إيراد اليوم</div>
    <div class="stat"><b id="sUnpaid">0</b>مبالغ غير مدفوعة</div>
  </div>
  <div class="card" style="margin-top:12px"><h2>مواعيد اليوم</h2><div id="todayList"></div></div>
</section>

<section id="patients" class="hidden">
  <div class="card">
    <h2 id="pFormTitle">إضافة مريض</h2>
    <input type="hidden" id="pId">
    <label>الاسم</label><input id="pName">
    <div class="row">
      <div><label>رقم الهاتف</label><input id="pPhone" type="tel"></div>
      <div><label>العمر</label><input id="pAge" type="number" min="0"></div>
    </div>
    <div class="row">
      <div><label>الجنس</label><select id="pGender"><option>ذكر</option><option>أنثى</option></select></div>
      <div><label>فصيلة الدم</label><select id="pBlood"><option value="">-</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></div>
    </div>
    <label>ملاحظات (حساسية، أمراض مزمنة...)</label><textarea id="pNotes"></textarea>
    <button class="btn" id="pSave">حفظ</button>
    <button class="btn sec hidden" id="pCancel">إلغاء</button>
  </div>
  <div class="card">
    <h2>قائمة المرضى</h2>
    <input id="pSearch" placeholder="🔍 بحث بالاسم أو الهاتف">
    <div id="pList"></div>
  </div>
</section>

<section id="appts" class="hidden">
  <div class="card">
    <h2>حجز موعد</h2>
    <label>المريض</label><select id="aPatient"></select>
    <div class="row">
      <div><label>التاريخ</label><input id="aDate" type="date"></div>
      <div><label>الوقت</label><input id="aTime" type="time"></div>
    </div>
    <label>سبب الزيارة</label><input id="aReason">
    <button class="btn" id="aSave">حجز</button>
  </div>
  <div class="card"><h2>كل المواعيد</h2><div id="aList"></div></div>
</section>

<section id="visits" class="hidden">
  <div class="card">
    <h2>تسجيل زيارة / كشف</h2>
    <label>المريض</label><select id="vPatient"></select>
    <label>التشخيص</label><textarea id="vDiag"></textarea>
    <label>العلاج / الوصفة</label><textarea id="vRx"></textarea>
    <div class="row">
      <div><label>قيمة الكشف</label><input id="vFee" type="number" min="0" value="0"></div>
      <div><label>المدفوع</label><input id="vPaid" type="number" min="0" value="0"></div>
    </div>
    <button class="btn" id="vSave">حفظ الزيارة</button>
  </div>
  <div class="card"><h2>سجل الزيارات</h2><div id="vList"></div></div>
</section>

<section id="backup" class="hidden">
  <div class="card">
    <h2>نسخ احتياطي</h2>
    <p>البيانات محفوظة في هذا المتصفح فقط. احفظ نسخة بشكل دوري.</p>
    <button class="btn" id="bExport">⬇️ تصدير البيانات (JSON)</button>
    <label>استيراد نسخة</label><input type="file" id="bImport" accept=".json">
    <button class="btn del" id="bClear">مسح كل البيانات</button>
  </div>
</section>

</main>
<script>
const KEY = "clinic_data_v1";
let db = { patients: [], appts: [], visits: [] };
try { db = Object.assign(db, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}

const $ = id => document.getElementById(id);
const save = () => localStorage.setItem(KEY, JSON.stringify(db));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const today = () => new Date().toISOString().slice(0, 10);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pName = id => (db.patients.find(p => p.id === id) || { name: "(محذوف)" }).name;

// Tabs
$("nav").addEventListener("click", e => {
  const t = e.target.dataset.tab; if (!t) return;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b === e.target));
  document.querySelectorAll("main > section").forEach(s => s.classList.toggle("hidden", s.id !== t));
  render();
});

// Patients
function clearPForm() {
  ["pId", "pName", "pPhone", "pAge", "pNotes"].forEach(i => $(i).value = "");
  $("pBlood").value = ""; $("pFormTitle").textContent = "إضافة مريض"; $("pCancel").classList.add("hidden");
}
$("pSave").onclick = () => {
  const name = $("pName").value.trim();
  if (!name) return alert("اكتب اسم المريض");
  const data = { name, phone: $("pPhone").value.trim(), age: $("pAge").value, gender: $("pGender").value, blood: $("pBlood").value, notes: $("pNotes").value.trim() };
  const id = $("pId").value;
  if (id) Object.assign(db.patients.find(p => p.id === id), data);
  else db.patients.push({ id: uid(), created: today(), ...data });
  save(); clearPForm(); render();
};
$("pCancel").onclick = clearPForm;
$("pSearch").oninput = render;
window.editP = id => {
  const p = db.patients.find(x => x.id === id);
  $("pId").value = p.id; $("pName").value = p.name; $("pPhone").value = p.phone; $("pAge").value = p.age;
  $("pGender").value = p.gender; $("pBlood").value = p.blood; $("pNotes").value = p.notes;
  $("pFormTitle").textContent = "تعديل مريض"; $("pCancel").classList.remove("hidden"); scrollTo(0, 0);
};
window.delP = id => {
  if (!confirm("حذف المريض وكل مواعيده وزياراته؟")) return;
  db.patients = db.patients.filter(p => p.id !== id);
  db.appts = db.appts.filter(a => a.pid !== id);
  db.visits = db.visits.filter(v => v.pid !== id);
  save(); render();
};

// Appointments
$("aSave").onclick = () => {
  if (!$("aPatient").value) return alert("أضف مريضًا أولًا");
  if (!$("aDate").value || !$("aTime").value) return alert("حدد التاريخ والوقت");
  db.appts.push({ id: uid(), pid: $("aPatient").value, date: $("aDate").value, time: $("aTime").value, reason: $("aReason").value.trim(), done: false });
  save(); $("aReason").value = ""; render();
};
window.toggleA = id => { const a = db.appts.find(x => x.id === id); a.done = !a.done; save(); render(); };
window.delA = id => { if (confirm("حذف الموعد؟")) { db.appts = db.appts.filter(a => a.id !== id); save(); render(); } };

// Visits
$("vSave").onclick = () => {
  if (!$("vPatient").value) return alert("اختر المريض");
  db.visits.push({ id: uid(), pid: $("vPatient").value, date: today(), diag: $("vDiag").value.trim(), rx: $("vRx").value.trim(), fee: +$("vFee").value || 0, paid: +$("vPaid").value || 0 });
  save(); ["vDiag", "vRx"].forEach(i => $(i).value = ""); $("vFee").value = 0; $("vPaid").value = 0; render();
};
window.payV = id => {
  const v = db.visits.find(x => x.id === id);
  const left = v.fee - v.paid;
  const n = +prompt("المتبقي " + left + " — أدخل المبلغ المدفوع الآن:", left);
  if (n > 0) { v.paid = Math.min(v.fee, v.paid + n); save(); render(); }
};
window.delV = id => { if (confirm("حذف الزيارة؟")) { db.visits = db.visits.filter(v => v.id !== id); save(); render(); } };

// Backup
$("bExport").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 2)], { type: "application/json" }));
  a.download = "clinic-backup-" + today() + ".json"; a.click();
};
$("bImport").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.patients) || !Array.isArray(d.appts) || !Array.isArray(d.visits)) throw 0;
      if (confirm("سيتم استبدال البيانات الحالية. متأكد؟")) { db = d; save(); render(); alert("تم الاستيراد"); }
    } catch { alert("ملف غير صالح"); }
  };
  r.readAsText(f);
};
$("bClear").onclick = () => { if (confirm("مسح كل البيانات نهائيًا؟")) { db = { patients: [], appts: [], visits: [] }; save(); render(); } };

// Render
function render() {
  const t = today();
  $("sPatients").textContent = db.patients.length;
  const todays = db.appts.filter(a => a.date === t).sort((a, b) => a.time.localeCompare(b.time));
  $("sToday").textContent = todays.length;
  $("sIncome").textContent = db.visits.filter(v => v.date === t).reduce((s, v) => s + v.paid, 0);
  $("sUnpaid").textContent = db.visits.reduce((s, v) => s + (v.fee - v.paid), 0);
  $("todayList").innerHTML = todays.map(a => `<div class="item"><div><b>${esc(pName(a.pid))}</b><small>${esc(a.time)} — ${esc(a.reason)}</small></div><span class="tag ${a.done ? "done" : ""}">${a.done ? "تم" : "قادم"}</span></div>`).join("") || "<small>لا توجد مواعيد اليوم</small>";

  const q = $("pSearch").value.trim().toLowerCase();
  $("pList").innerHTML = db.patients.filter(p => !q || p.name.toLowerCase().includes(q) || (p.phone || "").includes(q)).map(p =>
    `<div class="item"><div><b>${esc(p.name)}</b><small>${esc(p.phone)} ${p.age ? "• " + esc(p.age) + " سنة" : ""} • ${esc(p.gender)} ${p.blood ? "• " + esc(p.blood) : ""}</small>${p.notes ? `<small>📝 ${esc(p.notes)}</small>` : ""}</div><div><button class="btn sec" onclick="editP('${p.id}')">تعديل</button> <button class="btn del" onclick="delP('${p.id}')">حذف</button></div></div>`).join("") || "<small>لا يوجد مرضى</small>";

  const opts = db.patients.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("");
  [$("aPatient"), $("vPatient")].forEach(s => { const cur = s.value; s.innerHTML = opts; if (cur) s.value = cur; });

  $("aList").innerHTML = [...db.appts].sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time)).map(a =>
    `<div class="item"><div><b>${esc(pName(a.pid))}</b><small>${esc(a.date)} ${esc(a.time)} — ${esc(a.reason)}</small></div><div><button class="btn sec" onclick="toggleA('${a.id}')">${a.done ? "إرجاع" : "تم"}</button> <button class="btn del" onclick="delA('${a.id}')">حذف</button></div></div>`).join("") || "<small>لا توجد مواعيد</small>";

  $("vList").innerHTML = [...db.visits].reverse().map(v => {
    const left = v.fee - v.paid;
    return `<div class="item"><div><b>${esc(pName(v.pid))}</b> <small>${esc(v.date)}</small><small>تشخيص: ${esc(v.diag)}</small><small>علاج: ${esc(v.rx)}</small><small>الكشف ${v.fee} • مدفوع ${v.paid} ${left > 0 ? `<span class="tag unpaid">متبقي ${left}</span>` : ""}</small></div><div>${left > 0 ? `<button class="btn" onclick="payV('${v.id}')">دفع</button> ` : ""}<button class="btn del" onclick="delV('${v.id}')">حذف</button></div></div>`;
  }).join("") || "<small>لا توجد زيارات</small>";
}
$("aDate").value = today();
render();
</script>
</body>
</html>
